<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>reveal.js</title>
    <link rel="stylesheet" href="css/reveal.css">
    <link rel="stylesheet" href="css/theme/black.css">
    <!-- Theme used for syntax highlighting of code -->
    <link rel="stylesheet" href="lib/css/zenburn.css">
    <!-- Printing and PDF exports -->
    <script>
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.type = 'text/css';
    link.href = window.location.search.match(/print-pdf/gi) ? 'css/print/pdf.css' : 'css/print/paper.css';
    document.getElementsByTagName('head')[0].appendChild(link);
    </script>
</head>

<body>
    <div class="reveal">
        <div class="slides">
            <section>JavaScript</section>
            <section data-markdown>
                <textarea data-template>
					## Functions

					1. Define a function
					1. Declare a function
					1. Arrow functions
				</textarea>
            </section>
            <section data-markdown>
                <textarea data-template>
					## Define a function
					```javascript	
					const square = function (x){
						return x * x;
					};
					```
				</textarea>
            </section>
            <section data-markdown>
                <textarea data-template>
					## Declare a function
					```javascript	
					function square (x){
						return x * x;
					};
					```
				</textarea>
            </section>
            <section data-markdown>
                <textarea data-template>
					## Arrow functions
					```javascript	
					cons square = (x) => {
						return x * x;
					};
					```
				</textarea>
            </section>
            <section data-markdown>
                <textarea data-template>
					## Exercise
					```javascript	
					const ingredient = function(amount, unit, name) {
						console.log(`${amount} ${unit} ${name}`);
					};
					ingredient(1, "can", "chickpeas");
					ingredient(0.25, "cup", "tahini");
					ingredient(0.25, "cup", "lemon juice");
					ingredient(1, "clove", "garlic");
					ingredient(2, "tablespoon", "olive oil");
					ingredient(0.5, "teaspoon", "cumin");
					```
				</textarea>
            </section>
            <section data-markdown>
                <textarea data-template>
					## Arrow functions
					Create an arrow function that returns the GCD (greatest common divisor) of **a** and **b**. 
					Remember that the GCD of **a** and **b** is:
					* **a**; if **a** and **b** are equals
					* The GCD **c** and **d**; if **a** and **b** are different, where **c** is the minor, and **d** is the difference between the major and the minor
				</textarea>
            </section>
        </div>
    </div>
    <script src="lib/js/head.min.js"></script>
    <script src="js/reveal.js"></script>
    <script>
    // More info about config & dependencies:
    // - https://github.com/hakimel/reveal.js#configuration
    // - https://github.com/hakimel/reveal.js#dependencies
    Reveal.initialize({
        dependencies: [
            { src: 'plugin/markdown/marked.js' },
            { src: 'plugin/markdown/markdown.js' },
            { src: 'plugin/notes/notes.js', async: true },
            { src: 'plugin/highlight/highlight.js', async: true, callback: function() { hljs.initHighlightingOnLoad(); } }
        ]
    });
    </script>
</body>

</html>
