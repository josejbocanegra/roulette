<head>
    <title>My first app in meteor</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>

<body>
    <h1>Using templates</h1>
    {{> profile}}
    {{> formulario}}
</body>

<template name="formulario">
    <form>
        <input type="text" name="name" placeholder="Type to add new tasks">
        <input type="text" class="form-control">
        <div class="form-group row">
            <label for="example-date-input" class="col-2 col-form-label">Date</label>
            <div class="col-10">
                <input class="form-control" type="date" value="2011-08-19" id="date">
            </div>
        </div>
        <input type="submit" value="Add profile">
    </form>
</template>

<template name="profile">
    {{#each profilesCollection}}
    <p>
        {{name}}
        {{age}}
    </p>
    {{/each}}
</template>
